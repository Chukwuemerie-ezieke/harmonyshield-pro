# Local Postgres for development (production uses a managed Postgres behind Cloudflare Hyperdrive)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: havona
      POSTGRES_PASSWORD: havona
      POSTGRES_DB: havonashield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
